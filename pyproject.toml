[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens-python"
version = "0.3.0"
description = "A streaming desktop and command-line analyzer for structured application logs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
gui = [
    "PySide6-Essentials>=6.9,<7",
    # PYSIDE-3474 can abort CPython before 3.12 with the 6.12.0 wheels.
    "PySide6-Essentials!=6.12.0; python_version < '3.12'",
]

[project.urls]
Repository = "https://github.com/aadarsha-hiremath/loglens-python"

[project.scripts]
loglens = "loglens.cli:main"

[project.gui-scripts]
loglens-gui = "loglens.gui:main"

[tool.setuptools]
packages = ["loglens"]
