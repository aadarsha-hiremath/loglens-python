name: Test
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt's offscreen graphics libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0
      - run: python -m pip install ".[gui]"
      - name: Test on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Test Qt offscreen on Linux
        if: runner.os == 'Linux'
        run: env QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -v
      - run: loglens examples/checkout.log --format json
